<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JO FIT UI Fixture</title><style>
:root{font-family:system-ui;background:#0b0d12;color:#f5f3f5;color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:24px 3vw;background:#0b0d12}.shell{max-width:1200px;margin:auto}header{display:flex;align-items:center;gap:14px;justify-content:space-between;padding:10px 0 25px;border-bottom:1px solid #353544}.brandname{font-size:23px;font-weight:950}.brandtag{font-size:10px;letter-spacing:2px;color:#adacb6}.header-actions{display:flex;flex-wrap:wrap;gap:8px}button{cursor:pointer;border-radius:11px;border:1px solid #5c4c5a;background:#28232f;color:#fff;padding:10px 12px}h1{font-size:clamp(32px,4vw,61px);margin:8px 0}h1 em{color:#fa6c84;font-style:normal}p{color:#b1b6c4}nav{display:flex;overflow-x:auto;gap:8px;margin:21px 0}.tab{white-space:nowrap}.tab.active{background:#602f41}.hero{display:grid;grid-template-columns:1fr 38%;align-items:center;gap:22px;margin:18px 0}.forma-hero-art{min-height:250px}.forma-hero-art img{width:100%;height:260px;object-fit:cover;border-radius:18px}.columns,.progress-duo{display:grid;grid-template-columns:1fr 1fr;gap:15px}.workouts,.progress-card,.jo-panel{background:#181c26;border:1px solid #3d414b;padding:17px;border-radius:16px}.days{margin:14px 0}.section-top h2{margin:0}.section-top{margin-bottom:10px}.save-day-btn{display:block}.progress-summary{padding:18px}a{color:#ff869a}@media(max-width:650px){.hero,.columns,.progress-duo{grid-template-columns:1fr}}
</style></head><body><div class="shell"><header><div class="brandname">JO <span style="color:#fb5263">FIT</span><div class="brandtag">TRAIN. LEARN. GROW.</div></div><div class="header-actions"><select id="profileSelect"><option value="pA">Owen</option><option value="pB">Jonathan</option></select><button id="addProfile">+ Profiel</button><button id="backupBtn">Back-up</button><button id="importBtn">Import</button><button id="formaEditText">Teksten</button></div></header>
<section class="hero"><div><div id="formaHeroEyebrow">JO FIT</div><h1><span id="formaHeroTitle">Jouw kracht.</span><br><em id="formaHeroAccent">Jouw vooruitgang.</em></h1><p id="formaHeroDescription">Train doelgericht. Zie wat je bereikt.</p></div><div class="forma-hero-art"><img src="../assets/jofit-hero.webp" alt="hero"></div></section>
<nav><button class="tab active" data-tab="schema">Mijn schema</button><button class="tab" data-tab="progress">Logboek</button><button class="tab" data-tab="coach">Coach</button><button class="tab" data-tab="friends">Vrienden</button><button class="tab" data-tab="vision">Vision</button><button class="tab" data-tab="library">Oefenbibliotheek</button></nav>
<main id="view"></main></div>
<script>
const EX={'bench-press':{id:'bench-press',name:'Bankdrukken',primary:['chest','triceps'],equipment:'Halter + bank',reps:'8–12'},'incline-curl':{id:'incline-curl',name:'Incline dumbbell curl',primary:['biceps'],equipment:'Dumbbells'},'squat':{id:'squat',name:'Squat',primary:['quads','glutes'],equipment:'Halter'}};
const keys=['ma','wo','vr','za','zo'];const make=()=>({ma:[{id:'bench-press',kg:44,sets:3,reps:'8–12',done:0},{id:'incline-curl',kg:12.5,sets:3,reps:'10–12',done:0}],wo:[{id:'bench-press',kg:44,sets:3,reps:'8–12',done:0},{id:'incline-curl',kg:12.5,sets:3,reps:'8–12',done:0}],vr:[],za:[],zo:[]});
let allProfiles={active:'pA',profiles:{pA:{name:'Owen',activeRoutine:'basis',routines:{basis:{schedule:make()}},sessions:[]},pB:{name:'Jonathan',activeRoutine:'basis',routines:{basis:{schedule:make()}},sessions:[]}}};
let activeProfile='pA',current='wo',tab='schema';function persist(){localStorage.setItem('forma_v2_profiles',JSON.stringify(allProfiles));}
function toast(s){window.lastToast=s;console.log('TOAST',s);}
function switchTab(id){tab=id;renderView();}
function renderView(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const view=document.getElementById('view');
 if(tab==='schema')view.innerHTML='<div class="section-top"><h2>Jouw trainingsweek</h2></div><div class="days">Woensdag</div><div class="columns"><section class="workouts"><h3>Oefeningen</h3>Bankdrukken en dumbbell curl</section><aside class="workouts">Schema</aside></div>';
 else if(tab==='progress')view.innerHTML='<section class="section-top"><h2>Jouw persoonlijke logboek</h2></section><div class="progress-summary">Overzicht</div><div class="progress-duo"><section class="progress-card">Geschiedenis</section><section class="progress-card">Grafiek</section></div>';
 else if(tab==='vision')view.innerHTML='<section class="section-top"><h2>JO FIT Vision</h2></section><div class="jo-layout"><div class="jo-panel"><select id="joVisionEx"><option value="bench-press">Bankdrukken</option></select><input type="file" id="joVisionFile" accept="video/*"><video id="joVisionPlayer"></video></div></div>';
 else view.innerHTML='<section class="section-top"><h2>'+tab+'</h2></section><div class="progress-duo"><section class="progress-card">Bestaand onderdeel</section></div>';
}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
document.getElementById('profileSelect').onchange=e=>{activeProfile=e.target.value;allProfiles.active=activeProfile;renderView()};
renderView();persist();
</script><script defer src="../upgrade/boot.js"></script></body></html>
