name: JO FIT code checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          for file in jofit-cloud.js jofit-rules.js jofit-duo.js jofit-nutrition.js jofit-shell.js jofit-health.js jofit-tech.js jofit-workout-core.js; do node --check "$file"; done
      - name: Unit tests
        run: node --test tests/*.test.cjs
