name: JO FIT tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check jofit-cloud.js
          node --check jofit-rules.js
          node --check jofit-duo.js
          node --check jofit-nutrition.js
          node --check jofit-shell.js
      - name: Pure rules and nutrition tests
        run: node --test tests/rules-and-nutrition.test.cjs
